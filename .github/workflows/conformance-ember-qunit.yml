name: conformance-ember-qunit

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: conformance-ember-qunit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        # Both Ember builds, at the 5.12 floor the package promises, the current
        # LTS, and the app's own (latest) ember-source.
        build: [vite, classic]
        ember: ['5.12', '6.12', latest]
    uses: ./.github/workflows/conformance-driver.yml
    with:
      name: ember-qunit (${{ matrix.build }}, ${{ matrix.ember }})
      # Pin the leg's ember-source, then print what resolved, so a run shows
      # which Ember it actually tested.
      setup: ${{ format('{0}pnpm --filter test-app-ember-{1} list ember-source', matrix.ember != 'latest' && format('pnpm --filter test-app-ember-{0} add -D ember-source@~{1}.0 && ', matrix.build, matrix.ember) || '', matrix.build) }}
      test: pnpm --filter test-app-ember-${{ matrix.build }} test
