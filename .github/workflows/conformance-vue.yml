name: conformance-vue

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: conformance-vue-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Typecheck, the fixture-parity test, then the catalog under the dom
          # driver (Vitest + jsdom, through @testing-library/vue).
          - runner: dom
            setup: ''
            test: pnpm --filter test-app-vue test
            artifacts: ''
          # The catalog under the vitest-browser driver, in Chromium.
          - runner: vitest-browser
            setup: pnpm --filter test-app-vue exec playwright install --with-deps chromium
            test: pnpm --filter test-app-vue test:browser
            artifacts: test-apps/vue/.vitest/attachments
    uses: ./.github/workflows/conformance-driver.yml
    with:
      name: vue (${{ matrix.runner }})
      setup: ${{ matrix.setup }}
      test: ${{ matrix.test }}
      artifacts: ${{ matrix.artifacts }}
