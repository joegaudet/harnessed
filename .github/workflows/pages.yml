name: pages

# Publishes docs/site, with the README's GIFs from docs/media, to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/media/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - run: |
          mkdir -p _site/media
          cp -R docs/site/. _site/
          cp docs/media/*.gif _site/media/
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
