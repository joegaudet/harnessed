name: pages

# Publishes docs/site, with the README's GIFs from docs/media, the guide built from docs-app
# into guide/, and the API reference into api/, to GitHub Pages. The guide is built from main;
# the API reference from the latest release's sources, so it never shows unreleased API:
# release.yml dispatches this after publishing, and a site-only push to main keeps it at that
# release.
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/media/**'
      - 'docs-app/**'
      - 'packages/*/src/**'
      - '.github/workflows/pages.yml'
      - 'docs/api.css'
      - 'typedoc.json'
      - 'packages/*/typedoc.json'
      - 'scripts/typedoc-site.mjs'
      - 'scripts/llms-full.mjs'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm guide:build
      # shortcut: only src comes from the tag, so a package added since the last release shows
      # up early; build the whole tag in a worktree if that starts to matter.
      - name: Use the latest release's sources for the API reference
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          git checkout "$tag" -- ':(glob)packages/*/src/**'
          # "Defined in" links point at the release's lines (packages mode only reads
          # gitRevision from packageOptions). CI gates the docs on main; this renders what
          # shipped, so a warning doesn't block a deploy.
          node -e '
            const fs = require("node:fs"), c = JSON.parse(fs.readFileSync("typedoc.json"))
            c.packageOptions.gitRevision = process.argv[1]
            c.treatWarningsAsErrors = false
            fs.writeFileSync("typedoc.json", JSON.stringify(c))
          ' "$tag"
      - run: pnpm build
      - run: pnpm docs:api
      - uses: actions/configure-pages@v6
      - run: |
          mkdir -p _site/media
          cp -R docs/site/. _site/
          cp docs/media/*.gif _site/media/
          cp -R docs-app/dist _site/guide
          cp -R docs/api _site/api
          # Deep links into the guide land on Pages' 404; the app routes them.
          cp docs-app/dist/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
