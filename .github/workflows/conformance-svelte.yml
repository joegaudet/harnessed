name: conformance-svelte

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: conformance-svelte-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          # svelte-check, the fixture-parity test, then the catalog under the dom
          # driver (Vitest + jsdom, through @testing-library/svelte).
          - runner: dom
            setup: ''
            test: pnpm --filter test-app-svelte test
            artifacts: ''
          # The catalog under the vitest-browser driver, in Chromium.
          - runner: vitest-browser
            setup: pnpm --filter test-app-svelte exec playwright install --with-deps chromium
            test: pnpm --filter test-app-svelte test:browser
            artifacts: test-apps/svelte/.vitest/attachments
    uses: ./.github/workflows/conformance-driver.yml
    with:
      name: svelte (${{ matrix.runner }})
      setup: ${{ matrix.setup }}
      test: ${{ matrix.test }}
      artifacts: ${{ matrix.artifacts }}
