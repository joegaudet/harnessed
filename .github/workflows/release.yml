name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  # Never cancel a publish half-way through.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Trusted publishing is OIDC: npm trades this short-lived token for
      # publish rights, and attests the tarball back to this commit and this
      # workflow. No NPM_TOKEN is involved, so there is no long-lived
      # credential to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs node >= 22.14.0.
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The runner images ship npm 10.x, which predates trusted publishing and
      # fails an OIDC publish with a misleading E404. npm >= 11.5.1 is the real
      # requirement; upgrade before anything tries to publish.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Version PR, or publish if one was merged
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN: publishing authenticates through OIDC. Each
          # package must name this repository and this workflow file
          # (release.yml) as a trusted publisher in its npmjs.com settings, or
          # the publish is refused. Provenance is generated automatically.
