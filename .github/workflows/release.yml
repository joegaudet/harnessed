name: release

# Two steps, so a release is always a deliberate act:
#
#   push to main   changesets opens or updates the "chore: version packages" PR.
#                  Merging it bumps versions and changelogs; nothing publishes.
#   push a v* tag  publishes to npm and creates the GitHub release. The tag must
#                  be on main and match every public package's version:
#
#                    git tag -a v1.2.3 -m v1.2.3 && git push origin v1.2.3
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release
  # Never cancel a publish half-way through.
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only checks out. The version PR is pushed and opened with a
    # GitHub App token, because GitHub never runs workflows for pushes made
    # with GITHUB_TOKEN: the PR would sit without its required checks.
    permissions:
      contents: read
    steps:
      - name: Mint a token for the release app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # No publish-script: with nothing to version, the action does nothing.
      - name: Open or update the version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # changesets/action v2 renamed every input; the v1 names fail the step.
        with:
          version-script: pnpm changeset version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          github-token: ${{ steps.app-token.outputs.token }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release.
      contents: write
      # Trusted publishing is OIDC: npm trades this short-lived token for
      # publish rights, and attests the tarball back to this commit and this
      # workflow. No NPM_TOKEN is involved, so there is no long-lived
      # credential to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag can point anywhere; only reviewed code on main gets published,
      # and only under the version the version PR gave it.
      - name: Check the tag is on main and matches the packages
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          node - "${GITHUB_REF_NAME#v}" <<'JS'
          const fs = require('node:fs')
          const want = process.argv[2]
          const wrong = fs.readdirSync('packages')
            .map(dir => `packages/${dir}/package.json`)
            .filter(file => fs.existsSync(file))
            .map(file => JSON.parse(fs.readFileSync(file, 'utf8')))
            .filter(pkg => !pkg.private && pkg.version !== want)
          if (wrong.length) {
            for (const pkg of wrong) console.log(`::error::${pkg.name} is ${pkg.version}, tag is v${want}`)
            process.exit(1)
          }
          JS

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs node >= 22.14.0; the npm upgrade below
          # needs more than that again, so track the 24 line.
          node-version: 24
          # No `cache: pnpm`: unprivileged jobs can write that store, so a publish job never restores it.
          registry-url: https://registry.npmjs.org

      # The runner images ship npm 10.x, which predates trusted publishing and
      # fails an OIDC publish with a misleading E404. npm >= 11.5.1 is the real
      # requirement; upgrade before anything tries to publish.
      # Pinned to the 11 line rather than @latest: npm 12 raised its own node
      # floor past what this job pins, and an unpinned upgrade turns a node
      # bump into a surprise release failure. 11.5.1 is the real minimum.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - run: pnpm install --frozen-lockfile

      # `pnpm release` builds, then runs scripts/publish.mjs rather than
      # `changeset publish` -- changesets hands the publish to pnpm in a pnpm
      # workspace, and pnpm publish speaks neither OIDC nor provenance. See the
      # script's header. It skips anything already on the registry, so
      # re-running this job after a partial failure publishes only what is left.
      #
      # No NODE_AUTH_TOKEN: each package must name this repository and this
      # workflow file (release.yml) as a trusted publisher on npmjs.com, or the
      # publish is refused.
      - run: pnpm release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
