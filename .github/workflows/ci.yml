name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: lint, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint

  typecheck:
    name: typecheck (ts ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.2 is the floor the peer range promises — the first version with
        # standard decorators and `accessor`. Testing it is the only way that
        # promise means anything.
        typescript: ['5.2', '6', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -Dw typescript@${{ matrix.typescript }}
      # Only the published packages: the peer range is a promise about them, and
      # the conformance package pulls in build-tooling types that need newer TS.
      - run: pnpm typecheck:packages

  rules:
    name: eslint rules and package unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The rule tests load a real harnessed.config.ts through @harnessed-ts/config,
      # which resolves to its build output.
      - run: pnpm build
      - run: pnpm test:rules
      # Package unit tests: the Babel plugin through both Ember decorator
      # pipelines, the injectable resolver from its built file, the chai and
      # qunit assertion adapters, and the release script's publish plan.
      - run: pnpm test:units

  conformance-dom:
    name: conformance/dom (node ${{ matrix.node }}, tl-dom ${{ matrix.testing-library }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        testing-library: ['10', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter conformance add -D @testing-library/dom@${{ matrix.testing-library }}
      - run: pnpm build
      - run: pnpm test:dom

  conformance-playwright:
    name: conformance/playwright (node ${{ matrix.node }}, pw ${{ matrix.playwright }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        playwright: ['1.62', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every package that compiles against Playwright, not just conformance:
      # each one's own devDependency is what its .d.ts resolves `Page` and
      # `TestType` against (gherkin's for `withWorld`). Upgrading only some
      # leaves two playwright-core copies in the store and every Page/TestType
      # becomes a distinct type, so the conformance build fails before a test
      # runs.
      - run: pnpm --filter conformance --filter @harnessed-ts/playwright --filter @harnessed-ts/gherkin add -D @playwright/test@${{ matrix.playwright }}
      - run: pnpm build
      - run: pnpm --filter conformance exec playwright install --with-deps chromium
      - run: pnpm test:playwright
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.node }}-${{ matrix.playwright }}
          path: |
            packages/conformance/test-results/
            packages/conformance/playwright-report/
          retention-days: 7
