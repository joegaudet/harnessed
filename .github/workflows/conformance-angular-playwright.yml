name: conformance-angular-playwright

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: conformance-angular-playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/conformance-driver.yml
    with:
      name: angular-playwright
      setup: pnpm --filter test-app-angular exec playwright install --with-deps chromium
      test: pnpm --filter test-app-angular test:playwright
      artifacts: test-apps/angular/test-results
