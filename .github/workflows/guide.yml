name: guide

# The guide (docs-app): every page renders, and the app typechecks.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: guide typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Kolay's toolchain (ember-eslint-parser) needs 24.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter docs-app typecheck
      - run: pnpm --filter docs-app test
