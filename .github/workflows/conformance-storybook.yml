name: conformance-storybook
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/conformance-driver.yml
    with:
      name: storybook
      setup: pnpm --filter test-app-storybook exec playwright install --with-deps chromium
      test: pnpm --filter test-app-storybook test
      artifacts: |
        test-apps/storybook/.vitest/attachments
        test-apps/storybook/test-results
