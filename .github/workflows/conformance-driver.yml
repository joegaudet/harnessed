name: conformance-driver

# One driver's conformance run. Each driver has a small caller workflow
# (conformance-<name>.yml) so its job shows up, and is required, on its own.
on:
  workflow_call:
    inputs:
      name:
        description: Display name of the driver and runner.
        type: string
        required: true
      setup:
        description: Shell run after the build, before the tests (browser installs).
        type: string
        default: ''
      test:
        description: The command that runs the catalog.
        type: string
        required: true
      node:
        type: string
        default: '22'
      artifacts:
        description: Paths uploaded when the run fails.
        type: string
        default: ''

jobs:
  conformance:
    name: conformance/${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runners import the built packages, never their sources.
      - run: pnpm build
      - if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - run: ${{ inputs.test }}
      - uses: actions/upload-artifact@v7
        if: failure() && inputs.artifacts != ''
        with:
          name: conformance-${{ inputs.name }}
          path: ${{ inputs.artifacts }}
          retention-days: 7
