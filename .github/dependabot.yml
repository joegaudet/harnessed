version: 2
updates:
  # The peers are what break this library for consumers, and CI already tests
  # peer majors — so these PRs carry real signal rather than noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it: a compromised version is
    # usually caught and pulled within days, and pnpm's minimumReleaseAge is
    # not re-checked inside Dependabot's own updater.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      testing-library:
        patterns: ['@testing-library/*']
      playwright:
        patterns: ['@playwright/*', 'playwright']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'prettier']
      # react-dom throws unless it matches react exactly, so they move together.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      build:
        patterns: ['tsup', 'esbuild', 'vite', 'vitest', '@vitejs/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
