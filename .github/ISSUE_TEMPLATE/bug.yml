name: Bug report
description: Something behaves differently from the documented guarantees.
labels: [bug]
body:
  - type: dropdown
    id: driver
    attributes:
      label: Which driver?
      description: If a behaviour differs BETWEEN drivers, that is a parity bug — pick both.
      multiple: true
      options:
        - '@harnessed-ts/dom (Testing Library / jsdom)'
        - '@harnessed-ts/playwright'
        - '@harnessed-ts/route'
        - '@harnessed-ts/eslint-plugin'
        - '@harnessed-ts/claude'
        - Not driver-specific
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `npm ls @harnessed-ts/core @harnessed-ts/dom @harnessed-ts/playwright @harnessed-ts/route`, plus node, typescript, and your test runner and bundler versions.
      render: text
    validations:
      required: true

  - type: textarea
    id: harness
    attributes:
      label: The harness
      description: The smallest harness class that shows the problem, and the markup it queries.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true

  - type: checkboxes
    id: setup
    attributes:
      label: Setup checks
      description: Both are required, and omitting either fails at runtime rather than at typecheck.
      options:
        - label: 'My tsconfig extends `@harnessed-ts/core/tsconfig.json`, or sets `target: ES2022`, `useDefineForClassFields: true`, and `ESNext.Decorators` in `lib`.'
        - label: 'My Vite and Vitest configs list `harnessedDecorators()` from `@harnessed-ts/core/vite` first.'
